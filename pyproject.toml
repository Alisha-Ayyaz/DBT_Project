[project]
name = "aws-dbt-snowflake"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alisha Ayyaz", email = "alishaayyaz2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.6",
]

[project.scripts]
dbt-snowflake = "dbt_snowflake:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dbt_snowflake"
